services:
  recorders:
    image: opcua-recorders:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ecu.local.json:/app/ecu.local.json:ro
      - ./lynx.local.json:/app/lynx.local.json:ro
      - recorder_certs:/app/certs

volumes:
  recorder_certs:
